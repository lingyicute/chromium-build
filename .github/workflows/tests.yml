name: Offline tests

on:
  push:

# Read-only smoke tests (Python stdlib, bash, GNU tar). Never builds Chromium.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run tests on the image and system Python the build stages use
        run: |
          command -v zstd
          /usr/bin/python3 -m unittest discover -s tests -v
