name: Chromium local build segment

on:
  workflow_call:
    inputs:
      stage:
        description: "'00' fetches and configures a fresh tree; '01'-'08' resume a checkpoint."
        required: true
        type: string
      artifact-id:
        description: Checkpoint artifact ID; must be empty for stage 00.
        required: false
        type: string
        default: ''
      sha256:
        description: Producer SHA-256 of the checkpoint manifest; must be empty for stage 00.
        required: false
        type: string
        default: ''
      final:
        required: false
        type: boolean
        default: false
    outputs:
      status:
        value: ${{ jobs.build.outputs.status }}
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      status: ${{ steps.build.outputs.status }}
      artifact-id: ${{ steps.upload-retry.outputs.artifact-id || steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    # Every step is time-boxed: continue-on-error tolerates a failure, not a hang,
    # and an unbounded step would run into the job limit and take the stage with it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate control-plane inputs (never shell-interpolate expressions)
        timeout-minutes: 1
        env:
          STAGE: ${{ inputs.stage }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          FINAL_STAGE: ${{ inputs.final }}
        run: |
          python3 - <<'PY'
          import os, re
          # Stage 00 builds a fresh tree, so it must not name a checkpoint.
          fresh = os.environ['STAGE'] == '00'
          for key, pattern in [
              ('STAGE', r'0[0-8]'),
              ('ARTIFACT_ID', r'' if fresh else r'[1-9][0-9]*'),
              ('EXPECTED_SHA256', r'' if fresh else r'[0-9a-f]{64}'),
              ('FINAL_STAGE', r'false' if fresh else r'true|false'),
          ]:
              if not re.fullmatch(pattern, os.environ[key]):
                  raise SystemExit('Invalid ' + key)
          PY
      - name: Prepare disposable hosted runner (no apt)
        timeout-minutes: 15
        run: bash .github/scripts/host.sh
      - name: Resolve stable, fetch locked source, run upstream hooks, configure
        if: inputs.stage == '00'
        timeout-minutes: 245
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=INT --kill-after=120s 240m bash .github/scripts/fetch.sh 2>&1 \
            | tee -i "$RUNNER_TEMP/chromium-logs/prepare.log"
      - name: Save source resolution and GN configuration
        if: inputs.stage == '00'
        # A record only: the same metadata travels in the checkpoint and ships with the APK.
        # Bounded as well, so a hung upload cannot stall the compile that follows.
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: /mnt/chromium-relay/metadata/
          if-no-files-found: error
          retention-days: 14
      - name: Download exact checkpoint ID from this run only
        if: inputs.stage != '00'
        id: download
        timeout-minutes: 70
        # A transient artifact-service error should not stall an unattended run.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: /mnt/chromium-transfer/checkpoint
          merge-multiple: true
          digest-mismatch: error
          # Deliberately omit github-token, repository, run-id and pattern.
      - name: Discard the partial checkpoint download
        if: inputs.stage != '00' && steps.download.outcome != 'success'
        timeout-minutes: 2
        run: rm -rf -- /mnt/chromium-transfer/checkpoint
      - name: Retry the checkpoint download once
        if: inputs.stage != '00' && steps.download.outcome != 'success'
        timeout-minutes: 70
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: /mnt/chromium-transfer/checkpoint
          merge-multiple: true
          digest-mismatch: error
      - name: Verify producer hash, consume chunks, restore tree
        if: inputs.stage != '00'
        timeout-minutes: 40
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: bash .github/scripts/restore.sh
      - name: Compile until completion or our orderly checkpoint deadline
        id: build
        # Backstop only: build.py stops Ninja at the job deadline (<= 330 min).
        timeout-minutes: 335
        env:
          STAGE: ${{ inputs.stage }}
          FINAL_STAGE: ${{ inputs.final }}
        run: bash .github/scripts/build.sh
      - name: Verify APK signature and assemble output
        if: steps.build.outputs.status == 'completed'
        # The post-build steps are bounded so that even after an orderly final-stage
        # stop, verify + upload + retry + unverified fallback + logs fit in the job.
        timeout-minutes: 3
        run: bash .github/scripts/release.sh
      - name: Upload APK and build record (not a GitHub Release)
        if: steps.build.outputs.status == 'completed'
        id: apk
        timeout-minutes: 4
        # Until this succeeds, the finished APK exists only on this runner.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          path: ${{ runner.temp }}/chromium-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retry the APK upload once
        if: steps.build.outputs.status == 'completed' && steps.apk.outcome != 'success'
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # New name: the failed attempt may have left a partial artifact behind.
          name: apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}-retry
          path: ${{ runner.temp }}/chromium-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep the unverified APK for inspection if a post-build step failed
        if: failure() && steps.build.outputs.status == 'completed'
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          path: /mnt/chromium-relay/src/out/Release/apks/ChromePublic.apk
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
      - name: Destructively checkpoint unfinished build
        if: steps.build.outputs.status == 'running' && !inputs.final
        id: pack
        timeout-minutes: 45
        run: bash .github/scripts/pack.sh
      - name: Upload immutable checkpoint
        if: steps.build.outputs.status == 'running' && !inputs.final
        id: upload
        timeout-minutes: 35
        # pack.sh has already deleted the tree: without a second try, one failed
        # upload would throw away everything this stage compiled.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          path: |
            /mnt/chromium-transfer/checkpoint/tree.manifest
            /mnt/chromium-transfer/checkpoint/tree.part-*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
          overwrite: false
      - name: Retry the checkpoint upload once (best effort within the job limit)
        if: steps.build.outputs.status == 'running' && !inputs.final && steps.upload.outcome != 'success'
        id: upload-retry
        timeout-minutes: 35
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # New name: the failed attempt may have left a partial artifact behind.
          name: tree-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}-retry
          path: |
            /mnt/chromium-transfer/checkpoint/tree.manifest
            /mnt/chromium-transfer/checkpoint/tree.part-*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
          overwrite: false
      - name: Save stage logs
        if: always()
        # Diagnostics must never fail a stage whose checkpoint or APK is already
        # safe, nor push the worst-case schedule past the job limit.
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          path: ${{ runner.temp }}/chromium-logs/
          retention-days: 7
          if-no-files-found: ignore
