name: Chromium Stable Android arm64

on:
  workflow_dispatch:

# No release pushes, PR writes, OIDC, secrets, or cross-run artifact access.
permissions:
  contents: read

concurrency:
  group: chromium-stable-android
  cancel-in-progress: false

jobs:
  # Stage 00: fetch and configure a fresh tree, then compile with the time left
  # instead of paying for an extra checkpoint export/download/restore cycle.
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '00'

  part-01:
    needs: prepare
    if: ${{ needs.prepare.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '01'
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      sha256: ${{ needs.prepare.outputs.sha256 }}

  part-02:
    needs: part-01
    if: ${{ needs.part-01.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '02'
      artifact-id: ${{ needs.part-01.outputs.artifact-id }}
      sha256: ${{ needs.part-01.outputs.sha256 }}

  part-03:
    needs: part-02
    if: ${{ needs.part-02.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '03'
      artifact-id: ${{ needs.part-02.outputs.artifact-id }}
      sha256: ${{ needs.part-02.outputs.sha256 }}

  part-04:
    needs: part-03
    if: ${{ needs.part-03.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '04'
      artifact-id: ${{ needs.part-03.outputs.artifact-id }}
      sha256: ${{ needs.part-03.outputs.sha256 }}

  part-05:
    needs: part-04
    if: ${{ needs.part-04.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '05'
      artifact-id: ${{ needs.part-04.outputs.artifact-id }}
      sha256: ${{ needs.part-04.outputs.sha256 }}

  part-06:
    needs: part-05
    if: ${{ needs.part-05.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '06'
      artifact-id: ${{ needs.part-05.outputs.artifact-id }}
      sha256: ${{ needs.part-05.outputs.sha256 }}

  part-07:
    needs: part-06
    if: ${{ needs.part-06.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '07'
      artifact-id: ${{ needs.part-06.outputs.artifact-id }}
      sha256: ${{ needs.part-06.outputs.sha256 }}

  part-08:
    needs: part-07
    if: ${{ needs.part-07.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '08'
      artifact-id: ${{ needs.part-07.outputs.artifact-id }}
      sha256: ${{ needs.part-07.outputs.sha256 }}

  result:
    needs: [prepare, part-01, part-02, part-03, part-04, part-05, part-06, part-07, part-08]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless a stage actually completed
        timeout-minutes: 2
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import json, os, re, sys
          raw_needs = json.loads(os.environ['NEEDS_JSON'])
          needs = raw_needs if isinstance(raw_needs, dict) else {}
          order = ['prepare'] + [f'part-{i:02d}' for i in range(1, 9)]
          output_keys = ('status', 'artifact-id', 'apk-id', 'sha256')
          def stage_job(name):
              job = needs.get(name)
              return job if isinstance(job, dict) else {}
          def stage_result(name):
              res = stage_job(name).get('result')
              return res if isinstance(res, str) and res else 'unknown'
          def stage_output(name, key):
              outputs = stage_job(name).get('outputs')
              value = outputs.get(key) if isinstance(outputs, dict) else ''
              return value if isinstance(value, str) else ''
          def stage_status(name):
              return stage_output(name, 'status')
          def valid_artifact_id(value):
              return bool(re.fullmatch(r'[1-9][0-9]{0,15}', value) and int(value) <= 9007199254740991)
          def clean_skipped(name):
              return stage_result(name) == 'skipped' and all(stage_output(name, k) == '' for k in output_keys)
          def successful_checkpoint(name):
              return (stage_result(name) == 'success' and stage_status(name) == 'running'
                      and valid_artifact_id(stage_output(name, 'artifact-id'))
                      and re.fullmatch(r'[0-9a-f]{64}', stage_output(name, 'sha256')) is not None
                      and stage_output(name, 'apk-id') == '')
          def cell(text):
              return text.replace('`', '').replace('|', '/').replace('\r', ' ').replace('\n', ' ').strip() or '-'
          errors = [name for name in order if stage_result(name) in ('failure', 'cancelled')]
          completed = [name for name in order if stage_status(name) == 'completed']
          exhausted = (stage_result(order[-1]) == 'success' and stage_status(order[-1]) == 'exhausted'
                       and stage_output(order[-1], 'artifact-id') == ''
                       and stage_output(order[-1], 'apk-id') == ''
                       and stage_output(order[-1], 'sha256') == ''
                       and all(successful_checkpoint(n) for n in order[:-1]))
          if len(completed) == 1:
              idx = order.index(completed[0])
              ok = (stage_result(completed[0]) == 'success'
                    and valid_artifact_id(stage_output(completed[0], 'apk-id'))
                    and stage_output(completed[0], 'artifact-id') == ''
                    and stage_output(completed[0], 'sha256') == ''
                    and all(successful_checkpoint(n) for n in order[:idx])
                    and all(clean_skipped(n) for n in order[idx + 1:]))
          else:
              ok = False

          if ok:
              reason = f'APK completed in `{completed[0]}`; see the `apk-*` artifact.'
          elif all(clean_skipped(n) for n in order):
              reason = 'FAILED: `prepare` was skipped (workflow may only run from the default branch).'
          elif len(completed) > 1:
              reason = 'FAILED: multiple stages reported `completed`: ' + ', '.join(completed) + '.'
          elif (len(completed) == 1 and all(successful_checkpoint(n) for n in order[:order.index(completed[0])])
                and stage_result(completed[0]) == 'cancelled'):
              reason = f'FAILED: `{completed[0]}` was cancelled after building the APK, before publication completed.'
          elif (len(completed) == 1 and all(successful_checkpoint(n) for n in order[:order.index(completed[0])])
                and stage_result(completed[0]) != 'success'):
              reason = (f'FAILED: `{completed[0]}` built the APK, but verifying or uploading it failed; '
                        'an `unverified-apk-*` artifact may remain, for inspection only.')
          elif errors:
              reason = 'FAILED: required stage(s) failed or were cancelled: ' + ', '.join(errors) + '.'
          elif completed and not valid_artifact_id(stage_output(completed[0], 'apk-id')):
              reason = f'FAILED: `{completed[0]}` reported completion without a confirmed APK artifact.'
          elif exhausted:
              reason = 'FAILED: prepare and all 8 build stages ran without finishing; stage budget was exhausted.'
          else:
              reason = 'FAILED: no stage produced a validly completed APK. Inspect stage logs.'

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              try:
                  with open(summary, 'a', encoding='utf-8') as f:
                      f.write('## Chromium Stable Android arm64\n')
                      f.write(reason + '\n\n')
                      f.write('| Stage | Result | Output status |\n|---|---|---|\n')
                      for name in order:
                          f.write(f"| `{name}` | `{cell(stage_result(name))}` | `{cell(stage_status(name) or '-')}` |\n")
                      f.write('\nDevelopment signing key only. Not a production release.\n')
              except OSError as exc:
                  print(f'::warning::Failed to append result summary: {exc}', file=sys.stderr)
          if not ok:
              raise SystemExit(reason)
          print(reason)
          PY
