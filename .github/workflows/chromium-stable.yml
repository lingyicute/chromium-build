name: Chromium Stable Android arm64

on:
  workflow_dispatch:

# No release pushes, PR writes, OIDC, secrets, or cross-run artifact access.
permissions:
  contents: read

concurrency:
  group: chromium-stable-android
  cancel-in-progress: false

jobs:
  # Stage 00: fetch and configure a fresh tree, then compile with the time left
  # instead of paying for an extra checkpoint export/download/restore cycle.
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '00'

  part-01:
    needs: prepare
    if: ${{ needs.prepare.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '01'
      artifact-id: ${{ needs.prepare.outputs.artifact-id }}
      sha256: ${{ needs.prepare.outputs.sha256 }}

  part-02:
    needs: part-01
    if: ${{ needs.part-01.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '02'
      artifact-id: ${{ needs.part-01.outputs.artifact-id }}
      sha256: ${{ needs.part-01.outputs.sha256 }}

  part-03:
    needs: part-02
    if: ${{ needs.part-02.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '03'
      artifact-id: ${{ needs.part-02.outputs.artifact-id }}
      sha256: ${{ needs.part-02.outputs.sha256 }}

  part-04:
    needs: part-03
    if: ${{ needs.part-03.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '04'
      artifact-id: ${{ needs.part-03.outputs.artifact-id }}
      sha256: ${{ needs.part-03.outputs.sha256 }}

  part-05:
    needs: part-04
    if: ${{ needs.part-04.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '05'
      artifact-id: ${{ needs.part-04.outputs.artifact-id }}
      sha256: ${{ needs.part-04.outputs.sha256 }}

  part-06:
    needs: part-05
    if: ${{ needs.part-05.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '06'
      artifact-id: ${{ needs.part-05.outputs.artifact-id }}
      sha256: ${{ needs.part-05.outputs.sha256 }}

  part-07:
    needs: part-06
    if: ${{ needs.part-06.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '07'
      artifact-id: ${{ needs.part-06.outputs.artifact-id }}
      sha256: ${{ needs.part-06.outputs.sha256 }}

  part-08:
    needs: part-07
    if: ${{ needs.part-07.outputs.status == 'running' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: '08'
      artifact-id: ${{ needs.part-07.outputs.artifact-id }}
      sha256: ${{ needs.part-07.outputs.sha256 }}

  result:
    needs: [prepare, part-01, part-02, part-03, part-04, part-05, part-06, part-07, part-08]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless a stage actually completed
        timeout-minutes: 2
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import json, os, re, sys

          order = ['prepare', *(f'part-{i:02d}' for i in range(1, 9))]
          needs = json.loads(os.environ['NEEDS_JSON'])
          stages = {}
          for name in order:
              job = needs.get(name) or {}
              out = job.get('outputs') or {}
              stages[name] = (
                  job.get('result') or 'unknown',
                  out.get('status') or '',
                  out.get('artifact-id') or '',
                  out.get('apk-id') or '',
                  out.get('sha256') or '',
              )

          def valid_id(v):
              return bool(re.fullmatch(r'[1-9][0-9]{0,15}', v) and int(v) <= 9007199254740991)

          def is_skipped(n):
              return stages[n] == ('skipped', '', '', '', '')

          def is_checkpoint(n):
              res, status, ckpt, apk, sha = stages[n]
              return (res == 'success' and status == 'running' and valid_id(ckpt)
                      and not apk and bool(re.fullmatch(r'[0-9a-f]{64}', sha)))

          errors = [n for n in order if stages[n][0] in ('failure', 'cancelled')]
          completed = [n for n in order if stages[n][1] == 'completed']
          chain_ok = ok = False
          if len(completed) == 1:
              done = completed[0]
              idx = order.index(done)
              res, _, ckpt, apk, sha = stages[done]
              chain_ok = (not ckpt and not sha
                          and all(is_checkpoint(n) for n in order[:idx])
                          and all(is_skipped(n) for n in order[idx + 1:]))
              ok = chain_ok and res == 'success' and valid_id(apk)

          if ok:
              reason = f'APK completed in `{completed[0]}`; see the `apk-*` artifact.'
          elif all(is_skipped(n) for n in order):
              reason = 'FAILED: `prepare` was skipped (workflow may only run from the default branch).'
          elif len(completed) > 1:
              reason = f"FAILED: multiple stages reported `completed`: {', '.join(completed)}."
          elif chain_ok and stages[completed[0]][0] == 'cancelled':
              reason = f'FAILED: `{completed[0]}` was cancelled after building the APK, before publication completed.'
          elif chain_ok and stages[completed[0]][0] == 'failure':
              reason = (f'FAILED: `{completed[0]}` built the APK, but verifying or uploading it failed; '
                        'an `unverified-apk-*` artifact may remain, for inspection only.')
          elif errors:
              reason = f"FAILED: stage(s) failed or were cancelled: {', '.join(errors)}."
          elif chain_ok and not valid_id(stages[completed[0]][3]):
              reason = f'FAILED: `{completed[0]}` completed without a confirmed APK artifact.'
          elif stages[order[-1]] == ('success', 'exhausted', '', '', '') and all(is_checkpoint(n) for n in order[:-1]):
              reason = 'FAILED: prepare and all 8 build stages ran without finishing; stage budget was exhausted.'
          else:
              reason = 'FAILED: no stage produced a validly completed APK. Inspect stage logs.'

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              rows = '\n'.join(f"| `{n}` | `{stages[n][0]}` | `{stages[n][1] or '-'}` |" for n in order)
              text = (f'## Chromium Stable Android arm64\n{reason}\n\n'
                      f'| Stage | Result | Output status |\n|---|---|---|\n{rows}\n\n'
                      'Development signing key only. Not a production release.\n')
              try:
                  with open(summary, 'a', encoding='utf-8') as f:
                      f.write(text)
              except OSError as exc:
                  print(f'::warning::Failed to append result summary: {exc}', file=sys.stderr)
          if not ok:
              raise SystemExit(reason)
          print(reason)
          PY
